plugins { id 'com.android.application' }

// Public source export: signing credentials stay outside the repository.
def signingPath = System.getenv('WRISTLENS_KEYSTORE')
def signingReady = signingPath != null && !signingPath.isBlank()

android {
    namespace 'com.daniil.wristlens.phone'
    compileSdk 36
    defaultConfig {
        applicationId 'com.daniil.wristlens'
        minSdk 29
        targetSdk 36
        versionCode 1800
        versionName '1.8.0'
    }
    signingConfigs {
        if (signingReady) {
            personal {
                storeFile file(signingPath)
                storePassword System.getenv('WRISTLENS_STORE_PASSWORD')
                keyAlias System.getenv('WRISTLENS_KEY_ALIAS')
                keyPassword System.getenv('WRISTLENS_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            if (signingReady) signingConfig signingConfigs.personal
        }
        release {
            if (signingReady) signingConfig signingConfigs.personal
            debuggable false
            minifyEnabled false
        }
    }
    testOptions { unitTests.includeAndroidResources = true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation project(':shared')
    implementation 'androidx.media3:media3-transformer:1.9.4'
    implementation 'androidx.media3:media3-effect:1.9.4'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
}
